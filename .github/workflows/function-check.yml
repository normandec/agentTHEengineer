name: Classroom function check
on:
  push:
    branches: [arena/20629a9d-agenttheengineer]
  workflow_dispatch:
permissions:
  contents: read
  statuses: write
jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CR_API: https://bbeeodsvaxykyhxrbnvz.supabase.co/functions/v1/classroom
    steps:
      - uses: actions/checkout@v4
      - name: Report deployed function body
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          body="$(curl --max-time 20 --silent --show-error "$CR_API/health" || true)"
          description="$(printf '%s' "$body" | tr '\n' ' ' | tr -cd '[:print:]' | cut -c1-130)"
          [ -n "$description" ] || description="empty response"
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=success -f context='AI Classroom deployed health' -f description="$description"
          printf '%s\n' "$body"
          printf '%s' "$body" | grep -q '"ok":true'
      - name: Smoke public API surface
        run: ./tools/smoke.sh
      - name: Run full fake council protocol
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          node tools/fakecouncil.js "$CR_API" 120 > /tmp/fakecouncil.log 2>&1
          result=$?
          cat /tmp/fakecouncil.log
          description="$(tail -8 /tmp/fakecouncil.log | tr '\n' ' ' | tr -cd '[:print:]' | cut -c1-130)"
          [ -n "$description" ] || description="fake council produced no output"
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=$([ "$result" -eq 0 ] && echo success || echo failure) -f context='AI Classroom fake council' -f description="$description"
          exit "$result"
